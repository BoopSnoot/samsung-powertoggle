[build-system]
requires = ["setuptools>=77.0"]

[project]
name = "samsung-powertoggle"
version = "1.0.3"
license = "LGPL-3.0"
description = "Samsung Smart TV power toggle"
authors = [{ name = "boopsnoot" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.21.0",
    "wakeonlan>=4.0.0",
    "samsungtvws>=3.0.6",
    "platformdirs>=4.13.7"
]

[project.urls]
"Source code" = "https://github.com/xchwarze/samsung-tv-ws-api"

[project.scripts]
samsung_powertoggle = "samsung_powertoggle.__main__:main"
